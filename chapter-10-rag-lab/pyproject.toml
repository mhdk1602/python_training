[project]
name = "rag-lab"
version = "0.1.0"
description = "Chapter 10 retrieval systems and agents capstone."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=0.5.5,<0.7",
  "fastapi>=0.115.0,<1.0",
  "pydantic>=2.8.0,<3.0",
  "requests>=2.32.0,<3.0",
  "uvicorn[standard]>=0.30.0,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9.0",
]

[tool.setuptools]
packages = ["rag_lab"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
