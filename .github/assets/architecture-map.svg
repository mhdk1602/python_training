<svg width="1200" height="780" viewBox="0 0 1200 780" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Repository architecture map</title>
  <desc id="desc">A static architecture diagram showing the trading platform and retrieval lab surfaces built from the repo.</desc>
  <defs>
    <linearGradient id="bg" x1="152" y1="32" x2="1044" y2="742" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5EFE4"/>
      <stop offset="1" stop-color="#EEF3EB"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="250" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24553F"/>
      <stop offset="1" stop-color="#4C775B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="780" rx="34" fill="url(#bg)"/>

  <text x="88" y="104" fill="#1F2F26" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700">Repository Architecture</text>
  <text x="88" y="144" fill="#516356" font-family="Inter, Arial, sans-serif" font-size="22">Two applied products grow out of the same notebook sequence.</text>

  <rect x="88" y="190" width="1024" height="112" rx="28" fill="#FBF8F1" stroke="#24553F" stroke-opacity="0.12"/>
  <text x="126" y="232" fill="#6A7A70" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.12em">FOUNDATIONS</text>
  <text x="126" y="270" fill="#1F2F26" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">00–05 notebooks</text>
  <text x="126" y="296" fill="#516356" font-family="Inter, Arial, sans-serif" font-size="17">Python, data modeling, storage, processing, streaming.</text>

  <rect x="520" y="218" width="170" height="54" rx="18" fill="#E4EDE4"/>
  <text x="605" y="252" fill="#24553F" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">07–08 AI notebooks</text>

  <rect x="732" y="218" width="240" height="54" rx="18" fill="#F6E4C8"/>
  <text x="852" y="252" fill="#7C5A24" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">09 quality + Chapter 10 contracts</text>

  <text x="548" y="350" fill="#6A7A70" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.12em">APPLICATIONS</text>
  <path d="M600 300V356" stroke="#24553F" stroke-width="5" stroke-linecap="round"/>
  <circle cx="600" cy="300" r="10" fill="#24553F"/>
  <circle cx="600" cy="356" r="10" fill="#24553F"/>
  <path d="M600 356C560 356 510 360 318 360" stroke="#24553F" stroke-width="5" stroke-linecap="round"/>
  <path d="M600 356C640 356 690 360 882 360" stroke="#24553F" stroke-width="5" stroke-linecap="round"/>
  <circle cx="318" cy="360" r="8" fill="#24553F"/>
  <circle cx="882" cy="360" r="8" fill="#24553F"/>

  <g transform="translate(64 382)">
    <rect width="500" height="304" rx="30" fill="url(#green)"/>
    <text x="40" y="48" fill="#DDE9E1" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.12em">APPLIED SURFACE A</text>
    <text x="40" y="94" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700">Stock Trading Platform</text>

    <rect x="40" y="132" width="178" height="80" rx="22" fill="#F7F3EB"/>
    <text x="62" y="162" fill="#24553F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Data layer</text>
    <text x="62" y="188" fill="#5B6C61" font-family="Inter, Arial, sans-serif" font-size="14">Postgres · dbt</text>
    <text x="62" y="208" fill="#5B6C61" font-family="Inter, Arial, sans-serif" font-size="14">SQLite</text>

    <rect x="236" y="132" width="108" height="80" rx="22" fill="#F7F3EB"/>
    <text x="258" y="162" fill="#24553F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">API</text>
    <text x="258" y="188" fill="#5B6C61" font-family="Inter, Arial, sans-serif" font-size="14">Flask</text>
    <text x="258" y="208" fill="#5B6C61" font-family="Inter, Arial, sans-serif" font-size="14">Hasura</text>

    <rect x="362" y="132" width="98" height="80" rx="22" fill="#F7F3EB"/>
    <text x="384" y="162" fill="#24553F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">UI</text>
    <text x="384" y="188" fill="#5B6C61" font-family="Inter, Arial, sans-serif" font-size="14">Next.js</text>

    <rect x="40" y="236" width="420" height="68" rx="22" fill="#E2EADF"/>
    <text x="62" y="265" fill="#24553F" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Ask Warren</text>
    <text x="62" y="291" fill="#506257" font-family="Inter, Arial, sans-serif" font-size="14">Prompts, market data, portfolio views</text>
  </g>

  <g transform="translate(636 382)">
    <rect width="500" height="304" rx="30" fill="#FBF8F1" stroke="#24553F" stroke-opacity="0.14"/>
    <text x="40" y="48" fill="#6A7A70" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.12em">APPLIED SURFACE B</text>
    <text x="40" y="94" fill="#1F2F26" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700">Retrieval Lab</text>

    <rect x="40" y="132" width="128" height="80" rx="22" fill="#E4EDE4"/>
    <text x="62" y="162" fill="#24553F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Sources</text>
    <text x="62" y="188" fill="#5B6C61" font-family="Inter, Arial, sans-serif" font-size="14">NPS</text>
    <text x="62" y="208" fill="#5B6C61" font-family="Inter, Arial, sans-serif" font-size="14">Markdown</text>

    <rect x="186" y="132" width="146" height="80" rx="22" fill="#E4EDE4"/>
    <text x="208" y="162" fill="#24553F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Pipeline</text>
    <text x="208" y="188" fill="#5B6C61" font-family="Inter, Arial, sans-serif" font-size="14">normalize · tag</text>
    <text x="208" y="208" fill="#5B6C61" font-family="Inter, Arial, sans-serif" font-size="14">chunk</text>

    <rect x="350" y="132" width="110" height="80" rx="22" fill="#E4EDE4"/>
    <text x="372" y="162" fill="#24553F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Index</text>
    <text x="372" y="188" fill="#5B6C61" font-family="Inter, Arial, sans-serif" font-size="14">Chroma</text>
    <text x="372" y="208" fill="#5B6C61" font-family="Inter, Arial, sans-serif" font-size="14">local store</text>

    <rect x="40" y="236" width="420" height="68" rx="22" fill="#F6E4C8"/>
    <text x="62" y="265" fill="#7C5A24" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Answer surface</text>
    <text x="62" y="291" fill="#7C5A24" font-family="Inter, Arial, sans-serif" font-size="14">FastAPI, citations, trace rail, bounded agent</text>
  </g>
</svg>
