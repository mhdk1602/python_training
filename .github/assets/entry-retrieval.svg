<svg width="360" height="236" viewBox="0 0 360 236" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Retrieval lab entry card</title>
  <desc id="desc">A sand editorial card for the retrieval lab path.</desc>
  <defs>
    <linearGradient id="bg" x1="20" y1="16" x2="340" y2="208" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4DEB7"/>
      <stop offset="1" stop-color="#E9C77F"/>
    </linearGradient>
  </defs>
  <rect width="360" height="236" rx="28" fill="url(#bg)"/>
  <rect x="24" y="24" width="146" height="28" rx="14" fill="#FFF3DB" fill-opacity="0.6"/>
  <text x="40" y="43" fill="#7A5720" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.12em">MODERN CAPSTONE</text>
  <text x="24" y="94" fill="#3D2B13" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">Retrieval</text>
  <text x="24" y="128" fill="#3D2B13" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">Lab</text>
  <text x="24" y="156" fill="#6F562E" font-family="Inter, Arial, sans-serif" font-size="16">Adapters, tagging, vector search,</text>
  <text x="24" y="180" fill="#6F562E" font-family="Inter, Arial, sans-serif" font-size="16">citations, traces, and bounded agents.</text>
  <rect x="24" y="192" width="124" height="32" rx="16" fill="#24553F"/>
  <text x="86" y="213" fill="#F7F3EA" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.1em">OPEN FOLDER</text>
</svg>
