<svg width="360" height="236" viewBox="0 0 360 236" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Retrieval lab entry card</title>
  <desc id="desc">An amber night-sky card for the retrieval lab path.</desc>
  <defs>
    <radialGradient id="glow" cx="20%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#ffc46b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffc46b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="236" rx="24" fill="#0a0f1e"/>
  <rect width="360" height="236" rx="24" fill="url(#glow)"/>
  <rect x="24" y="22" width="160" height="28" rx="14" fill="none" stroke="#ffc46b" stroke-opacity="0.45"/>
  <text x="40" y="41" fill="#ffc46b" font-family="'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="0.12em">MODERN CAPSTONE</text>
  <text x="24" y="94" fill="#e9edfb" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="800">Retrieval</text>
  <text x="24" y="128" fill="#e9edfb" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="800">Lab</text>
  <text x="24" y="156" fill="#97a3c4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">Adapters, tagging, vector search,</text>
  <text x="24" y="178" fill="#97a3c4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">citations, traces, and bounded agents.</text>
  <rect x="24" y="192" width="124" height="32" rx="16" fill="#ffc46b"/>
  <text x="86" y="213" fill="#04060d" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.1em">OPEN FOLDER</text>
  <rect x="0.5" y="0.5" width="359" height="235" rx="23.5" fill="none" stroke="#ffc46b" stroke-opacity="0.25"/>
</svg>
