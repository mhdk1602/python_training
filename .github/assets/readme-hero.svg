<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Python training repository hero</title>
  <desc id="desc">A night-sky banner showing the repository's progression from foundations to a stock platform, a retrieval lab, and a fractal research wing.</desc>
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#62e6ff"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f471b5"/>
    </linearGradient>
    <linearGradient id="curveStroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#62e6ff">
        <animate attributeName="stop-color" values="#62e6ff;#a78bfa;#62e6ff" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f471b5">
        <animate attributeName="stop-color" values="#f471b5;#ffc46b;#f471b5" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#62e6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#62e6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#97a3c4" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="640" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="640" fill="#04060d"/>
    <rect width="1200" height="640" fill="url(#grid)"/>
    <ellipse cx="160" cy="-60" rx="560" ry="340" fill="url(#glowViolet)"/>
    <ellipse cx="1060" cy="700" rx="520" ry="320" fill="url(#glowCyan)"/>

    <g fill="#a7b4ff">
      <circle cx="120" cy="520" r="1.6" opacity="0.6"><animate attributeName="opacity" values="0.6;0.12;0.6" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="80" r="1.4" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.2s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="540" cy="560" r="1.8" opacity="0.55"><animate attributeName="opacity" values="0.55;0.14;0.55" dur="2.9s" begin="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="70" r="1.3" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.7s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="540" r="1.5" opacity="0.6"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" begin="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="90" r="1.6" opacity="0.55"><animate attributeName="opacity" values="0.55;0.12;0.55" dur="4.5s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="80" cy="160" r="1.3" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.9s" begin="2.2s" repeatCount="indefinite"/></circle>
    </g>

    <path d="M850 430 L850 390 L890 390 L890 430 L930 430 L970 430 L970 390 L930 390 L930 350 L970 350 L970 310 L930 310 L890 310 L890 350 L850 350 L850 310 L850 270 L890 270 L890 230 L850 230 L850 190 L850 150 L890 150 L890 190 L930 190 L930 150 L970 150 L970 190 L970 230 L930 230 L930 270 L970 270 L1010 270 L1050 270 L1050 230 L1010 230 L1010 190 L1010 150 L1050 150 L1050 190 L1090 190 L1090 150 L1130 150 L1130 190 L1130 230 L1090 230 L1090 270 L1130 270 L1130 310 L1130 350 L1090 350 L1090 310 L1050 310 L1010 310 L1010 350 L1050 350 L1050 390 L1010 390 L1010 430 L1050 430 L1090 430 L1090 390 L1130 390 L1130 430"
          stroke="url(#curveStroke)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"
          pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" opacity="0.92">
      <animate attributeName="stroke-dashoffset" values="1000;0;0;1000" keyTimes="0;0.55;0.82;1" dur="16s" repeatCount="indefinite"/>
    </path>
    <circle cx="850" cy="430" r="5.5" fill="#62e6ff"/>
    <text x="990" y="478" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#5b6886" letter-spacing="2">HILBERT · ORDER 3</text>

    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="84" y="150" font-size="15" font-weight="600" letter-spacing="6" fill="#62e6ff">PROJECT-FIRST TRAINING REPOSITORY</text>
      <text x="84" y="225" font-size="60" font-weight="800" fill="#e9edfb" letter-spacing="-1">Data Engineering</text>
      <text x="84" y="295" font-size="60" font-weight="800" fill="#e9edfb" letter-spacing="-1">with <tspan fill="#a78bfa">Python</tspan></text>
      <rect x="86" y="318" width="380" height="5" rx="2.5" fill="url(#brand)">
        <animate attributeName="width" values="0;380" dur="1.6s" fill="freeze"/>
      </rect>
      <text x="84" y="368" font-size="22" fill="#c7d0ec">From fundamentals to a trading platform, a retrieval lab</text>
      <text x="84" y="400" font-size="22" fill="#c7d0ec">with grounded answers, and a fractal research wing.</text>

      <g font-size="14" font-weight="600">
        <rect x="84" y="436" width="150" height="38" rx="19" fill="none" stroke="#62e6ff" stroke-opacity="0.45"/>
        <text x="159" y="460" text-anchor="middle" fill="#62e6ff">75 notebooks</text>
        <rect x="246" y="436" width="140" height="38" rx="19" fill="none" stroke="#a78bfa" stroke-opacity="0.5"/>
        <text x="316" y="460" text-anchor="middle" fill="#a78bfa">16 chapters</text>
        <rect x="398" y="436" width="200" height="38" rx="19" fill="none" stroke="#f471b5" stroke-opacity="0.45"/>
        <text x="498" y="460" text-anchor="middle" fill="#f471b5">6 browser studios</text>
        <rect x="610" y="436" width="180" height="38" rx="19" fill="none" stroke="#ffc46b" stroke-opacity="0.45"/>
        <text x="700" y="460" text-anchor="middle" fill="#ffc46b">2 applied systems</text>
      </g>

      <g font-size="16" font-weight="600">
        <text x="84" y="540" fill="#97a3c4">foundations</text>
        <text x="222" y="540" fill="#5b6886">›</text>
        <text x="248" y="540" fill="#97a3c4">systems</text>
        <text x="345" y="540" fill="#5b6886">›</text>
        <text x="371" y="540" fill="#97a3c4">retrieval</text>
        <text x="466" y="540" fill="#5b6886">›</text>
        <text x="492" y="540" fill="url(#brand)">research</text>
      </g>
      <text x="84" y="586" font-family="'Courier New', monospace" font-size="13" fill="#5b6886" letter-spacing="2">mhdk1602.github.io/python_training</text>
    </g>

    <rect x="1" y="1" width="1198" height="638" rx="27" fill="none" stroke="#97a3c4" stroke-opacity="0.18"/>
  </g>
</svg>
