<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Python training repository hero</title>
  <desc id="desc">An editorial banner showing the progression from notebooks to a stock platform and a retrieval lab.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1060" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4EDE1"/>
      <stop offset="1" stop-color="#E5EFE7"/>
    </linearGradient>
    <linearGradient id="accent" x1="183" y1="120" x2="1002" y2="494" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24553F"/>
      <stop offset="1" stop-color="#4E7A5D"/>
    </linearGradient>
    <filter id="shadow" x="80" y="70" width="1040" height="520" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#49614F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="640" rx="34" fill="url(#bg)"/>
  <g opacity="0.14">
    <path d="M76 111H1124" stroke="#24553F" stroke-width="1.4"/>
    <path d="M76 159H1124" stroke="#24553F" stroke-width="1.4"/>
    <path d="M76 207H1124" stroke="#24553F" stroke-width="1.4"/>
    <path d="M76 255H1124" stroke="#24553F" stroke-width="1.4"/>
    <path d="M76 303H1124" stroke="#24553F" stroke-width="1.4"/>
    <path d="M76 351H1124" stroke="#24553F" stroke-width="1.4"/>
    <path d="M76 399H1124" stroke="#24553F" stroke-width="1.4"/>
    <path d="M76 447H1124" stroke="#24553F" stroke-width="1.4"/>
    <path d="M76 495H1124" stroke="#24553F" stroke-width="1.4"/>
    <path d="M76 543H1124" stroke="#24553F" stroke-width="1.4"/>
    <path d="M156 70V570" stroke="#24553F" stroke-width="1.4"/>
    <path d="M294 70V570" stroke="#24553F" stroke-width="1.4"/>
    <path d="M432 70V570" stroke="#24553F" stroke-width="1.4"/>
    <path d="M570 70V570" stroke="#24553F" stroke-width="1.4"/>
    <path d="M708 70V570" stroke="#24553F" stroke-width="1.4"/>
    <path d="M846 70V570" stroke="#24553F" stroke-width="1.4"/>
    <path d="M984 70V570" stroke="#24553F" stroke-width="1.4"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="78" y="78" width="1044" height="484" rx="30" fill="#FBF8F1" stroke="#2B4D3D" stroke-opacity="0.12"/>
  </g>

  <rect x="118" y="118" width="144" height="32" rx="16" fill="#E2EADF"/>
  <text x="190" y="139" fill="#24553F" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0.12em">PROJECT-FIRST</text>

  <text x="118" y="210" fill="#1C2D24" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700">
    Data Engineering
  </text>
  <text x="118" y="278" fill="#1C2D24" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700">
    with Python
  </text>
  <text x="118" y="336" fill="#415549" font-family="Inter, Arial, sans-serif" font-size="24">
    From Python basics to shipped data products:
  </text>
  <text x="118" y="372" fill="#415549" font-family="Inter, Arial, sans-serif" font-size="24">
    a stock platform, a Streamlit dashboard,
  </text>
  <text x="118" y="408" fill="#415549" font-family="Inter, Arial, sans-serif" font-size="24">
    and a retrieval lab with grounded answers.
  </text>

  <g>
    <rect x="118" y="462" width="168" height="62" rx="18" fill="#244B37"/>
    <text x="148" y="488" fill="#F7F3EA" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">41 NOTEBOOKS</text>
    <text x="148" y="511" fill="#F7F3EA" font-family="Inter, Arial, sans-serif" font-size="14">6 learning tracks</text>

    <rect x="304" y="462" width="168" height="62" rx="18" fill="#F4E3C7"/>
    <text x="334" y="488" fill="#6B4E25" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">2 APPLIED SURFACES</text>
    <text x="334" y="511" fill="#6B4E25" font-family="Inter, Arial, sans-serif" font-size="14">trading + retrieval</text>
  </g>

  <g transform="translate(706 116)">
    <rect width="318" height="116" rx="26" fill="url(#accent)"/>
    <text x="28" y="38" fill="#F8F4EC" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.12em">APPLIED SYSTEM A</text>
    <text x="28" y="74" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700">Stock Trading Platform</text>
    <text x="28" y="100" fill="#D8E6DD" font-family="Inter, Arial, sans-serif" font-size="16">Next.js · GraphQL · Flask · Postgres</text>
  </g>

  <g transform="translate(664 278)">
    <rect width="360" height="168" rx="26" fill="#FFFDF7" stroke="#24553F" stroke-opacity="0.12"/>
    <text x="28" y="42" fill="#5B6B60" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.12em">APPLIED SYSTEM B</text>
    <text x="28" y="78" fill="#1C2D24" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700">Retrieval Lab</text>
    <text x="28" y="108" fill="#43574A" font-family="Inter, Arial, sans-serif" font-size="17">FastAPI service, content tagging, Chroma,</text>
    <text x="28" y="134" fill="#43574A" font-family="Inter, Arial, sans-serif" font-size="17">Ollama, bounded agents, traceable answers.</text>
  </g>

  <path d="M618 472C694 472 718 474 760 462" stroke="#24553F" stroke-width="4" stroke-linecap="round"/>
  <circle cx="618" cy="472" r="10" fill="#244B37"/>
  <circle cx="760" cy="462" r="10" fill="#244B37"/>
  <text x="608" y="444" fill="#24553F" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.08em">FOUNDATIONS TO SYSTEMS</text>
</svg>
