<svg width="360" height="236" viewBox="0 0 360 236" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Streamlit dashboard entry card</title>
  <desc id="desc">A green editorial card for the Streamlit dashboard path.</desc>
  <defs>
    <linearGradient id="bg" x1="18" y1="16" x2="344" y2="208" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24553F"/>
      <stop offset="1" stop-color="#4E775C"/>
    </linearGradient>
  </defs>
  <rect width="360" height="236" rx="28" fill="url(#bg)"/>
  <rect x="24" y="22" width="126" height="28" rx="14" fill="#DCE8E0" fill-opacity="0.14"/>
  <text x="40" y="41" fill="#E4EEE8" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.12em">FASTEST WAY IN</text>
  <text x="24" y="94" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">Streamlit</text>
  <text x="24" y="128" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">Dashboard</text>
  <text x="24" y="156" fill="#DCE8E0" font-family="Inter, Arial, sans-serif" font-size="16">Live charts, portfolio logic,</text>
  <text x="24" y="180" fill="#DCE8E0" font-family="Inter, Arial, sans-serif" font-size="16">and a zero-Docker teaching surface.</text>
  <rect x="24" y="192" width="124" height="32" rx="16" fill="#F4E4C8"/>
  <text x="86" y="213" fill="#6A4C21" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.1em">OPEN FOLDER</text>
</svg>
