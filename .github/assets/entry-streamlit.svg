<svg width="360" height="236" viewBox="0 0 360 236" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Streamlit dashboard entry card</title>
  <desc id="desc">A cyan night-sky card for the Streamlit dashboard path.</desc>
  <defs>
    <radialGradient id="glow" cx="20%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#62e6ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#62e6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="236" rx="24" fill="#0a0f1e"/>
  <rect width="360" height="236" rx="24" fill="url(#glow)"/>
  <rect x="24" y="22" width="152" height="28" rx="14" fill="none" stroke="#62e6ff" stroke-opacity="0.45"/>
  <text x="40" y="41" fill="#62e6ff" font-family="'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="0.12em">FASTEST WAY IN</text>
  <text x="24" y="94" fill="#e9edfb" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="800">Streamlit</text>
  <text x="24" y="128" fill="#e9edfb" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="800">Dashboard</text>
