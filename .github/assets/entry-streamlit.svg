  <text x="24" y="178" fill="#97a3c4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">a zero-Docker teaching surface.</text>
  <rect x="24" y="192" width="124" height="32" rx="16" fill="#62e6ff"/>
  <text x="86" y="213" fill="#04060d" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.1em">OPEN FOLDER</text>
  <rect x="0.5" y="0.5" width="359" height="235" rx="23.5" fill="none" stroke="#62e6ff" stroke-opacity="0.25"/>
