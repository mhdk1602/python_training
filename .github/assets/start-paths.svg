<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Choose your entry point</title>
  <desc id="desc">Three visual cards showing the main ways to start with the repository: Streamlit, full stack, and Chapter 10 retrieval lab.</desc>
  <defs>
    <linearGradient id="panel" x1="88" y1="32" x2="1114" y2="324" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F2E8"/>
      <stop offset="1" stop-color="#EEF4ED"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="320" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25553F"/>
      <stop offset="1" stop-color="#4A775A"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="320" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5E0BB"/>
      <stop offset="1" stop-color="#E7C78A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#panel)"/>
  <text x="88" y="76" fill="#1F2F26" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">Choose Your Entry Point</text>
  <text x="88" y="108" fill="#5A6C60" font-family="Inter, Arial, sans-serif" font-size="18">Start with the surface that matches your attention span, then branch outward.</text>

  <g transform="translate(88 146)">
    <rect width="320" height="156" rx="26" fill="url(#green)"/>
    <text x="28" y="38" fill="#DCE9E0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.12em">FASTEST WAY IN</text>
    <text x="28" y="78" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">Streamlit Dashboard</text>
    <text x="28" y="112" fill="#DDE8E1" font-family="Inter, Arial, sans-serif" font-size="16">No Docker, immediate payoff, live charts,</text>
    <text x="28" y="136" fill="#DDE8E1" font-family="Inter, Arial, sans-serif" font-size="16">portfolio logic, and an AI teaching surface.</text>
  </g>

  <g transform="translate(440 146)">
    <rect width="320" height="156" rx="26" fill="#FBF8F1" stroke="#25553F" stroke-opacity="0.12"/>
    <text x="28" y="38" fill="#68796E" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.12em">SYSTEM VIEW</text>
    <text x="28" y="78" fill="#1F2F26" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">Full Stack Platform</text>
    <text x="28" y="112" fill="#526459" font-family="Inter, Arial, sans-serif" font-size="16">Postgres, Hasura, Flask, Next.js,</text>
    <text x="28" y="136" fill="#526459" font-family="Inter, Arial, sans-serif" font-size="16">and the shape of a real data product.</text>
  </g>

  <g transform="translate(792 146)">
    <rect width="320" height="156" rx="26" fill="url(#sand)"/>
    <text x="28" y="38" fill="#7A5720" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.12em">MODERN CAPSTONE</text>
    <text x="28" y="78" fill="#3D2B13" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">Retrieval Lab</text>
    <text x="28" y="112" fill="#6E552E" font-family="Inter, Arial, sans-serif" font-size="16">Content adapters, tagging, vector search,</text>
    <text x="28" y="136" fill="#6E552E" font-family="Inter, Arial, sans-serif" font-size="16">citations, traces, and bounded agents.</text>
  </g>
</svg>
